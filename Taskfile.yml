version: '3'

vars:
  ARG_COUNT: '{{len .CLI_ARGS_LIST}}'
  PRODUCT: '{{if gt (len .CLI_ARGS_LIST) 0}}{{index .CLI_ARGS_LIST 0}}{{end}}'
  ENVIRONMENT: '{{if gt (len .CLI_ARGS_LIST) 1}}{{index .CLI_ARGS_LIST 1}}{{end}}'

tasks:
  default:
    desc: Show the config command guide.
    silent: true
    cmds:
      - task: help

  help:
    desc: Explain config, setup, and maintenance commands.
    silent: true
    cmds:
      - |
        printf '%s\n' \
          'Run isolated VPN workspace configs. VM images and clones are managed internally.' \
          '' \
          'CONFIG COMMANDS' \
          '  task list' \
          '  task create -- <product> <environment>' \
          '  task validate -- <product> <environment>' \
          '  task start -- <product> <environment>' \
          '  task stop -- <product> <environment>' \
          '  task status -- <product> <environment>' \
          '  task path -- <product> <environment>' \
          '  task delete -- <product> <environment>' \
          '  task stop-all' \
          '' \
          '  list          List available configs and runtime state.' \
          '  create        Create an empty host config without creating a VM.' \
          '  validate      Check bookmarks, VPN readiness, and config layout.' \
          '  start         Start a config; create its hidden runtime if needed.' \
          '  stop          Stop a config while preserving config and runtime state.' \
          '  status        Show config validity and runtime state.' \
          '  path          Print the config directory under ~/.config/vm-vpn.' \
          '  delete        Permanently delete a config and its hidden runtime.' \
          '  stop-all      Stop every running config.' \
          '' \
          'Arguments:' \
          '  product       Logical workspace or service name, such as demo.' \
          '  environment   Deployment environment, such as dev, staging, or prod.' \
          '                Both accept lowercase letters, numbers, and internal hyphens.' \
          '' \
          'SETUP AND MAINTENANCE' \
          '  task setup          Build the shared runtime image when it is missing.' \
          '  task seed -- demo dev' \
          '                      Copy tracked fake files into the demo/dev config.' \
          '  task clean          Permanently delete orphaned hidden runtimes.' \
          '  task image:build    Build the internal runtime image directly.' \
          '  task image:status   Diagnose the internal runtime image.' \
          '  task doctor         Verify development-shell tools.' \
          '  task check          Run all project quality gates.' \
          '  task help           Show this guide; also the default task.' \
          '' \
          'Examples:' \
          '  task list' \
          '  task create -- demo dev' \
          '  task validate -- demo dev' \
          '  task start -- demo dev'

  list:
    desc: List available configs and runtime state.
    cmds:
      - ./scripts/vm list

  create:
    desc: Create the host config for <product> <environment>.
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'create requires <product> <environment>; example: task create -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm create "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  validate:
    desc: Validate the <product> <environment> config.
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'validate requires <product> <environment>; example: task validate -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm validate "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  start:
    desc: Start <product> <environment>, creating its hidden runtime if needed.
    interactive: true
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'start requires <product> <environment>; example: task start -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm start "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  stop:
    desc: Stop <product> <environment> without deleting its config.
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'stop requires <product> <environment>; example: task stop -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm stop "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  status:
    desc: Show config validity and runtime state for <product> <environment>.
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'status requires <product> <environment>; example: task status -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm status "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  path:
    desc: Print the host path for <product> <environment>.
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'path requires <product> <environment>; example: task path -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm path "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  delete:
    desc: Permanently delete the <product> <environment> config and hidden runtime.
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'delete requires <product> <environment>; example: task delete -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm delete "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  stop-all:
    desc: Stop all running configs without deleting them.
    cmds:
      - ./scripts/vm stop-all

  setup:
    desc: Build the shared runtime image only when it is missing.
    cmds:
      - ./scripts/vm setup

  seed:
    desc: Populate the existing demo/dev config with tracked fake files.
    preconditions:
      - sh: test '{{.ARG_COUNT}}' -eq 2
        msg: 'seed requires demo dev; example: task seed -- demo dev'
    env:
      VM_VPN_PRODUCT: '{{.PRODUCT}}'
      VM_VPN_ENVIRONMENT: '{{.ENVIRONMENT}}'
    cmds:
      - ./scripts/vm seed "$VM_VPN_PRODUCT" "$VM_VPN_ENVIRONMENT"

  clean:
    desc: Permanently delete hidden runtimes that have no matching config.
    cmds:
      - ./scripts/vm clean

  image:build:
    desc: Build the internal shared runtime image directly.
    cmds:
      - ./scripts/vm image-build

  image:status:
    desc: Show Tart details for the internal shared runtime image.
    cmds:
      - ./scripts/vm image-status

  doctor:
    desc: Verify all development-shell tools are available.
    cmds:
      - ./scripts/vm doctor

  check:
    desc: Run tests, lint, formatting, and Nix flake validation.
    cmds:
      - ./scripts/ci-check
